plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.madhephaestus'
version = '3.2.13'
sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
}

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.library.path', file('native').absolutePath
}

tasks.named('compileJava') {
    options.release = 17
}

// ---- Native compilation ----

def nativeSrc = file('src/main/native')
def includeDir = file('../c/include')
def osName = org.gradle.internal.os.OperatingSystem.current()
def libPrefix = osName.isLinux() || osName.isMacOsX() ? 'lib' : ''
def libExt = osName.isWindows() ? 'dll' : (osName.isMacOsX() ? 'dylib' : 'so')
def libName = libPrefix + 'manifold_jni.' + libExt
def nativeOut = file("build/natives")

task compileNative(type: Exec) {
    workingDir nativeSrc
    inputs.dir(nativeSrc)
    outputs.dir(nativeOut)
    mkdir nativeOut

    if (osName.isWindows()) {
        commandLine 'cl', '/I' + includeDir.absolutePath, '/LD',
            'manifold_jni.c',
            '/Fe:' + nativeOut.absolutePath + '\\' + libName,
            '/std:c11'
    } else {
        def javaHome = System.getProperty('java.home')
        def jniInclude = new File(javaHome, 'include')
        if (!jniInclude.exists()) {
            jniInclude = new File(javaHome, '../include')
        }
        def osArch = System.getProperty('os.arch')
        def platformDir = osArch.contains('aarch') ? 'darwin' : 'linux'
        def platformInclude = new File(jniInclude, platformDir)

        def manifoldcLib = file('../../build/bindings/c/libmanifoldc.so')
        def args = ['cc', '-shared', '-fPIC',
            '-I' + includeDir.absolutePath,
            '-I' + jniInclude.absolutePath,
            '-Wl,-rpath,$ORIGIN',
            '-Wl,--no-as-needed']
        if (platformInclude.exists()) args << ('-I' + platformInclude.absolutePath)
        if (manifoldcLib.exists()) {
            args << '-L' + manifoldcLib.parentFile.absolutePath
            args << '-lmanifoldc'
        }
        args << 'manifold_jni.c'
        args << '-o'
        args << nativeOut.absolutePath + '/' + libName

        commandLine args
    }
}

tasks.named('classes') {
    dependsOn compileNative
}

tasks.named('processResources') {
    dependsOn compileNative
    doLast {
        def platformDir = (osName.isWindows() ? 'win-' : (osName.isMacOsX() ? 'mac-' : 'linux-')) +
            (osName.arch == 'aarch64' ? 'arm64' : 'x86_64')
        copy {
            from nativeOut
            into file("${buildDir}/resources/main/manifold3d/natives/$platformDir")
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'Clojars'
            url = 'https://clojars.org/repo'
            credentials {
                username = System.getenv('CLOJARS_USERNAME')
                password = System.getenv('CLOJARS_TOKEN')
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'manifold3d'
                description = 'Java bindings for Manifold3D CSG library'
                url = 'https://github.com/CommonWealthRobotics/manifold3d-java'
                licenses {
                    license {
                        name = 'Creative Commons Attribution 4.0 International'
                        url = 'https://creativecommons.org/licenses/by/4.0/'
                    }
                }
                scm {
                    connection = 'https://github.com/CommonWealthRobotics/manifold3d-java'
                    developerConnection = 'Kevin Harrington'
                    url = 'https://github.com/CommonWealthRobotics/manifold3d-java'
                }
            }
        }
    }
}

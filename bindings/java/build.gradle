plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.madhephaestus'
version = '3.2.13'
sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
}

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.library.path', file('native').absolutePath
}

tasks.named('compileJava') {
    options.release = 17
}

// ---- Native compilation ----

def nativeSrc = file('src/main/native')
def includeDir = file('../c/include')
def osName = org.gradle.internal.os.OperatingSystem.current()
def libPrefix = osName.isLinux() || osName.isMacOsX() ? 'lib' : ''
def libExt = osName.isWindows() ? 'dll' : (osName.isMacOsX() ? 'dylib' : 'so')
def libName = libPrefix + 'manifold_jni.' + libExt
def nativeOut = file("build/natives")

task compileNative(type: Exec) {
    workingDir nativeSrc
    inputs.dir(nativeSrc)
    outputs.dir(nativeOut)
    mkdir nativeOut

    if (osName.isWindows()) {
        def javaHome = System.getProperty('java.home')
        def jniInclude = new File(javaHome, 'include')
        if (!jniInclude.exists()) {
            jniInclude = new File(javaHome, '../include')
        }
        def winInclude = new File(jniInclude, 'win32')
        def winArgs = ['cl', '/I' + includeDir.absolutePath, '/I' + jniInclude.absolutePath]
        if (winInclude.exists()) winArgs << ('/I' + winInclude.absolutePath)
        def manifoldcLibDir = file('../../build/bindings/c')
        if (manifoldcLibDir.exists()) {
            winArgs << '/link' << '/LIBPATH:' + manifoldcLibDir.absolutePath << 'manifoldc.lib'
        }
        winArgs << '/LD', 'manifold_jni.c', '/Fe:' + nativeOut.absolutePath + '\\' + libName, '/std:c11'
        commandLine winArgs
    } else {
        def javaHome = System.getProperty('java.home')
        def jniInclude = new File(javaHome, 'include')
        if (!jniInclude.exists()) {
            jniInclude = new File(javaHome, '../include')
        }
        def osArch = System.getProperty('os.arch')
        def platformDir = osName.isMacOsX() && osArch.contains('aarch') ? 'darwin' : 'linux'
        def platformInclude = new File(jniInclude, platformDir)

        def manifoldcLib = file('../../build/bindings/c/libmanifoldc.' + libExt)
        def manifoldLib = file('../../build/src/libmanifold.' + libExt)
        def args = ['cc', '-shared', '-fPIC',
            '-I' + includeDir.absolutePath,
            '-I' + jniInclude.absolutePath,
            '-Wl,-rpath,$ORIGIN']
        if (platformDir != 'darwin') args << '-Wl,--no-as-needed'
        if (platformInclude.exists()) args << ('-I' + platformInclude.absolutePath)
        if (osName.isMacOsX()) {
            def targetArch = 'x86_64'
            if (manifoldLib.exists()) {
                def lipoResult = ['lipo', '-info', manifoldLib.absolutePath].execute().text.trim()
                if (lipoResult.contains('arm64') || lipoResult.contains('ARM')) targetArch = 'arm64'
            }
            args << '-arch' << targetArch
        }
        if (manifoldcLib.exists()) {
            args << '-L' + manifoldcLib.parentFile.absolutePath
            args << '-lmanifoldc'
        }
        args << 'manifold_jni.c'
        args << '-o'
        args << nativeOut.absolutePath + '/' + libName

        commandLine args
    }
}

tasks.named('classes') {
    dependsOn compileNative
}

tasks.named('processResources') {
    dependsOn compileNative
    doLast {
        def platformDir = (osName.isWindows() ? 'win-' : (osName.isMacOsX() ? 'mac-' : 'linux-')) +
            (osName.arch == 'aarch64' ? 'arm64' : 'x86_64')
        def targetDir = file("${buildDir}/resources/main/manifold3d/natives/$platformDir")
        copy {
            from nativeOut
            into targetDir
        }
        // Copy C libraries from CMake build
        def cmakeSrc = file('../../build/src')
        def cmakeCSrc = file('../../build/bindings/c')
        if (osName.isLinux()) {
            if (cmakeSrc.exists()) {
                copy {
                    from cmakeSrc
                    include 'libmanifold.so*', 'libmanifold.so'
                    into targetDir
                }
            }
            if (cmakeCSrc.exists()) {
                copy {
                    from cmakeCSrc
                    include 'libmanifoldc.so*', 'libmanifoldc.so'
                    into targetDir
                }
            }
        } else if (osName.isMacOsX()) {
            if (cmakeSrc.exists()) {
                copy {
                    from cmakeSrc
                    include 'libmanifold*.dylib*', 'libmanifold.dylib'
                    into targetDir
                }
            }
            if (cmakeCSrc.exists()) {
                copy {
                    from cmakeCSrc
                    include 'libmanifoldc*.dylib*', 'libmanifoldc.dylib'
                    into targetDir
                }
            }
            // Create .so symlinks to .dylib for Linux compatibility code that loads .so.3
            def libmanifoldDylib = new File(targetDir, 'libmanifold.dylib')
            if (libmanifoldDylib.exists()) {
                def soLink = new File(targetDir, 'libmanifold.so')
                if (!soLink.exists()) {
                    java.nio.file.Files.createSymbolicLink(soLink.toPath(), libmanifoldDylib.toPath())
                }
                def so3Link = new File(targetDir, 'libmanifold.so.3')
                if (!so3Link.exists()) {
                    java.nio.file.Files.createSymbolicLink(so3Link.toPath(), libmanifoldDylib.toPath())
                }
            }
            def libmanifoldcDylib = new File(targetDir, 'libmanifoldc.dylib')
            if (libmanifoldcDylib.exists()) {
                def soLink = new File(targetDir, 'libmanifoldc.so')
                if (!soLink.exists()) {
                    java.nio.file.Files.createSymbolicLink(soLink.toPath(), libmanifoldcDylib.toPath())
                }
                def so3Link = new File(targetDir, 'libmanifoldc.so.3')
                if (!so3Link.exists()) {
                    java.nio.file.Files.createSymbolicLink(so3Link.toPath(), libmanifoldcDylib.toPath())
                }
            }
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'Clojars'
            url = 'https://clojars.org/repo'
            credentials {
                username = System.getenv('CLOJARS_USERNAME')
                password = System.getenv('CLOJARS_TOKEN')
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'manifold3d'
                description = 'Java bindings for Manifold3D CSG library'
                url = 'https://github.com/CommonWealthRobotics/manifold3d-java'
                licenses {
                    license {
                        name = 'Creative Commons Attribution 4.0 International'
                        url = 'https://creativecommons.org/licenses/by/4.0/'
                    }
                }
                scm {
                    connection = 'https://github.com/CommonWealthRobotics/manifold3d-java'
                    developerConnection = 'Kevin Harrington'
                    url = 'https://github.com/CommonWealthRobotics/manifold3d-java'
                }
            }
        }
    }
}
